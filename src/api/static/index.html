<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:#3B82F6; --blue-dark:#1D4ED8; --blue-light:#EFF6FF;
      --green:#10B981; --green-light:#D1FAE5;
      --orange:#F59E0B; --orange-dark:#D97706; --orange-light:#FEF3C7;
      --red:#EF4444; --red-light:#FEE2E2;
      --gray-50:#F8FAFC; --gray-100:#F1F5F9; --gray-200:#E2E8F0;
      --gray-300:#CBD5E1; --gray-400:#94A3B8; --gray-500:#64748B;
      --gray-600:#475569; --gray-700:#334155; --gray-800:#1E293B; --gray-900:#0F172A;
      --white:#FFFFFF;
      --r:10px; --r-sm:6px; --r-lg:14px;
      --sh:0 2px 8px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
      --sh-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--gray-50); color:var(--gray-900); font-size:14px; line-height:1.5; min-height:100vh; }

    /* Navbar */
    .navbar { background:var(--white); border-bottom:1px solid var(--gray-200); position:sticky; top:0; z-index:100; }
    .navbar-inner { max-width:1280px; margin:0 auto; padding:0 24px; height:58px; display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:16px; font-weight:800; color:var(--gray-900); display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-icon { width:34px; height:34px; background:linear-gradient(135deg,var(--blue),var(--blue-dark)); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 3px 10px rgba(59,130,246,.35); }
    .nav-live { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--green); background:var(--green-light); padding:5px 12px; border-radius:20px; letter-spacing:.03em; }
    .nav-live::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.8s infinite; }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Layout */
    .main { max-width:1280px; margin:0 auto; width:100%; padding:28px 24px; }
    .page-header { margin-bottom:20px; }
    .page-title { font-size:22px; font-weight:800; color:var(--gray-900); }
    .page-sub { font-size:13px; color:var(--gray-500); margin-top:3px; }

    /* League Tabs */
    .league-tabs { display:flex; gap:0; border-bottom:2px solid var(--gray-200); overflow-x:auto; scrollbar-width:none; }
    .league-tabs::-webkit-scrollbar{display:none}
    .tab-btn { padding:10px 18px; font-size:13px; font-weight:500; color:var(--gray-500); background:none; border:none; border-bottom:2.5px solid transparent; margin-bottom:-2px; cursor:pointer; transition:all .15s; white-space:nowrap; display:flex; align-items:center; gap:6px; font-family:inherit; }
    .tab-btn img { width:15px; height:15px; object-fit:contain; }
    .tab-btn:hover { color:var(--gray-700); }
    .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:700; }

    /* Toolbar */
    .toolbar { display:flex; align-items:center; gap:10px; margin:18px 0 16px; flex-wrap:wrap; }
    .view-toggle { display:flex; background:var(--gray-100); border-radius:8px; padding:3px; gap:2px; }
    .vbtn { padding:7px 16px; font-size:12px; font-weight:700; border:none; border-radius:6px; cursor:pointer; color:var(--gray-500); background:transparent; transition:all .15s; font-family:inherit; letter-spacing:.02em; }
    .vbtn:hover { color:var(--gray-700); }
    .vbtn.active { background:var(--white); color:var(--blue); box-shadow:0 1px 4px rgba(0,0,0,.1); }
    .tsep { width:1px; height:28px; background:var(--gray-200); flex-shrink:0; }
    select.fsel { padding:7px 10px; border-radius:var(--r-sm); border:1px solid var(--gray-200); font-family:inherit; font-size:13px; color:var(--gray-700); background:var(--white); cursor:pointer; outline:none; transition:border-color .15s; }
    select.fsel:focus { border-color:var(--blue); }
    .pills { display:flex; gap:6px; flex-wrap:wrap; }
    .pill { padding:6px 14px; font-size:12px; font-weight:600; border-radius:20px; border:1px solid var(--gray-200); background:var(--white); color:var(--gray-500); cursor:pointer; transition:all .15s; font-family:inherit; }
    .pill:hover { border-color:var(--blue); color:var(--blue); }
    .pill.active { background:var(--blue); border-color:var(--blue); color:var(--white); }

    /* Match Grid */
    .match-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
    .match-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r); padding:16px; cursor:pointer; transition:all .2s; }
    .match-card:hover { border-color:var(--blue); box-shadow:var(--sh); transform:translateY(-1px); }
    .match-card.selected { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-light); }
    .card-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .card-league { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.06em; }
    .card-league img { width:14px; height:14px; object-fit:contain; }
    .card-round { font-size:10px; font-weight:600; color:var(--gray-300); }
    .card-teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-bottom:14px; }
    .team-home { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
    .team-away { display:flex; align-items:center; gap:8px; }
    .team-logo { width:26px; height:26px; object-fit:contain; }
    .team-name { font-size:13px; font-weight:700; color:var(--gray-800); line-height:1.3; }
    .score-box { text-align:center; min-width:56px; }
    .score { font-size:22px; font-weight:900; color:var(--gray-900); letter-spacing:-.5px; }
    .score-sep { color:var(--gray-300); font-weight:300; margin:0 3px; }
    .score-vs { font-size:13px; color:var(--gray-300); font-weight:500; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--gray-100); }
    .ktime { font-size:11px; color:var(--gray-400); }

    /* Badges */
    .badge { font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px; letter-spacing:.04em; text-transform:uppercase; }
    .badge-finished { background:var(--green-light); color:#059669; }
    .badge-ongoing { background:var(--red-light); color:var(--red); }
    .badge-upcoming { background:var(--gray-100); color:var(--gray-500); }

    /* State */
    .state-box { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:64px 24px; }
    .state-icon { font-size:42px; }
    .state-title { font-size:15px; font-weight:700; color:var(--gray-600); }
    .state-desc { font-size:13px; color:var(--gray-400); }
    .spinner { width:28px; height:28px; border:3px solid var(--gray-200); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; }

    /* Teams */
    .team-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
    .team-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r); padding:24px 16px 18px; text-align:center; transition:all .2s; }
    .team-card:hover { border-color:var(--gray-300); box-shadow:var(--sh); }
    .team-card img { width:60px; height:60px; object-fit:contain; margin-bottom:10px; display:block; margin-left:auto; margin-right:auto; }
    .team-card .tname { font-size:13px; font-weight:700; color:var(--gray-800); line-height:1.3; }

    /* H2H */
    .h2h-wrap { max-width:860px; margin:0 auto; }
    .h2h-picker { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); padding:32px; display:flex; align-items:flex-end; gap:16px; box-shadow:var(--sh); }
    .h2h-side { flex:1; display:flex; flex-direction:column; gap:8px; }
    .h2h-side-label { font-size:11px; font-weight:800; color:var(--gray-400); text-transform:uppercase; letter-spacing:.07em; }
    .h2h-sel { width:100%; padding:12px 14px; border-radius:var(--r); border:1.5px solid var(--gray-200); font-family:inherit; font-size:14px; font-weight:600; color:var(--gray-800); background:var(--gray-50); cursor:pointer; outline:none; transition:all .15s; appearance:none; }
    .h2h-sel:focus { border-color:var(--blue); background:var(--white); box-shadow:0 0 0 3px var(--blue-light); }
    .h2h-mid { display:flex; align-items:center; justify-content:center; padding-bottom:12px; }
    .h2h-vs { width:44px; height:44px; background:var(--gray-100); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--gray-400); }
    .h2h-btn { padding:13px 24px; border-radius:var(--r); background:linear-gradient(135deg,var(--blue),var(--blue-dark)); color:var(--white); border:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:800; box-shadow:0 4px 14px rgba(59,130,246,.35); transition:all .2s; white-space:nowrap; align-self:flex-end; }
    .h2h-btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(59,130,246,.4); }
    .h2h-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

    /* H2H Results */
    .h2h-results { margin-top:24px; display:none; }
    .h2h-results.on { display:block; }
    .h2h-summary-card { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); padding:28px 32px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; margin-bottom:16px; box-shadow:var(--sh); }
    .h2h-team-col { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .h2h-team-col img { width:60px; height:60px; object-fit:contain; }
    .h2h-team-col .n { font-size:15px; font-weight:800; color:var(--gray-900); text-align:center; }
    .h2h-center { display:flex; flex-direction:column; align-items:center; gap:16px; }
    .h2h-score-row { display:flex; align-items:center; gap:20px; }
    .h2h-stat { text-align:center; }
    .h2h-stat .num { font-size:36px; font-weight:900; line-height:1; }
    .h2h-stat .lbl { font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
    .h2h-stat.t1 .num { color:var(--blue); }
    .h2h-stat.dr .num { color:var(--gray-400); }
    .h2h-stat.t2 .num { color:var(--orange-dark); }
    .h2h-divider { width:1px; height:48px; background:var(--gray-200); }
    .h2h-count { font-size:12px; font-weight:600; color:var(--gray-400); }

    .h2h-list { background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh); }
    .h2h-list-head { display:grid; grid-template-columns:90px 1fr 90px 1fr 130px 70px 90px; gap:8px; padding:12px 24px; background:var(--gray-50); border-bottom:1px solid var(--gray-200); font-size:11px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; }
    .h2h-list-head span:nth-child(2) { text-align:right; }
    .h2h-list-head span:nth-child(3) { text-align:center; }
    .h2h-row { display:grid; grid-template-columns:90px 1fr 90px 1fr 130px 70px 90px; gap:8px; padding:11px 24px; border-bottom:1px solid var(--gray-100); align-items:center; transition:background .1s; }
    .h2h-row:last-child { border-bottom:none; }
    .h2h-row:hover { background:var(--gray-50); }
    .h2h-date { font-size:11px; color:var(--gray-400); font-weight:500; }
    .h2h-hn { text-align:right; font-size:13px; font-weight:700; color:var(--gray-800); }
    .h2h-hn.w { color:var(--green); }
    .h2h-sc { text-align:center; font-size:15px; font-weight:900; color:var(--gray-900); }
    .h2h-an { text-align:left; font-size:13px; font-weight:700; color:var(--gray-800); }
    .h2h-an.w { color:var(--green); }
    .h2h-s { font-size:10px; font-weight:700; color:var(--gray-400); background:var(--gray-100); padding:2px 7px; border-radius:4px; white-space:nowrap; }

    /* Panel */
    .panel-overlay { position:fixed; inset:0; background:rgba(15,23,42,.45); backdrop-filter:blur(3px); z-index:200; display:none; }
    .panel-overlay.open { display:block; }
    .detail-panel { position:fixed; right:0; top:0; bottom:0; width:420px; background:var(--white); z-index:201; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; box-shadow:-4px 0 40px rgba(0,0,0,.14); }
    .detail-panel.open { transform:translateX(0); }
    .panel-header { background:linear-gradient(160deg,#1a3a6e 0%,#0d2247 100%); padding:20px 20px 18px; position:relative; }
    .panel-close { position:absolute; top:14px; right:14px; background:rgba(255,255,255,.12); border:none; color:rgba(255,255,255,.7); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
    .panel-close:hover { background:rgba(255,255,255,.22); color:var(--white); }
    .panel-lg { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:700; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:.06em; margin-bottom:18px; }
    .panel-lg img { width:13px; height:13px; object-fit:contain; }
    .panel-score-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; }
    .p-team { display:flex; flex-direction:column; align-items:center; gap:7px; }
    .p-team img { width:48px; height:48px; object-fit:contain; }
    .p-name { font-size:13px; font-weight:800; color:var(--white); text-align:center; line-height:1.3; }
    .p-score { font-size:30px; font-weight:900; color:var(--white); text-align:center; letter-spacing:-1px; min-width:72px; }
    .panel-meta { display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); font-size:12px; color:rgba(255,255,255,.5); }
    .panel-tabs { display:flex; border-bottom:1px solid var(--gray-200); }
    .panel-tab { flex:1; padding:13px; font-size:12px; font-weight:700; color:var(--gray-400); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; transition:all .15s; font-family:inherit; }
    .panel-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
    .panel-body { flex:1; overflow-y:auto; padding:16px; }
    .tab-s { display:none; }
    .tab-s.active { display:block; }
    .sdiv { font-size:10px; font-weight:800; color:var(--gray-400); text-transform:uppercase; letter-spacing:.06em; padding:12px 0 6px; margin-top:4px; }
    .ev-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r-sm); transition:background .1s; }
    .ev-item:hover { background:var(--gray-50); }
    .ev-item.away { flex-direction:row-reverse; text-align:right; }
    .ev-icon { font-size:14px; flex-shrink:0; }
    .ev-min { font-size:11px; font-weight:800; color:var(--gray-500); min-width:26px; }
    .ev-info { flex:1; }
    .ev-player { font-size:13px; font-weight:700; color:var(--gray-800); }
    .ev-assist { font-size:11px; color:var(--gray-400); margin-top:1px; }
    .ev-score { font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-light); padding:2px 7px; border-radius:10px; }
    .lu-head { font-size:13px; font-weight:800; color:var(--gray-700); padding:14px 10px 6px; border-bottom:1px solid var(--gray-100); margin-top:4px; }
    .lu-sec { font-size:10px; font-weight:800; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; padding:8px 10px 4px; }
    .pl-row { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:var(--r-sm); }
    .pl-row:hover { background:var(--gray-50); }
    .pl-num { width:22px; text-align:center; font-size:11px; font-weight:800; color:var(--gray-400); }
    .pl-name { flex:1; font-size:13px; color:var(--gray-800); }
    .pl-rating { font-size:11px; font-weight:800; color:var(--white); background:var(--green); padding:2px 6px; border-radius:4px; }
    .sg-lbl { font-size:10px; font-weight:800; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; padding:14px 0 6px; }
    .st-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:6px 0; }
    .st-h,.st-a { font-size:13px; font-weight:700; }
    .st-h { text-align:right; }
    .st-a { text-align:left; }
    .st-l { text-align:center; font-size:11px; color:var(--gray-400); padding:0 8px; }

    /* Pagination */
    .pagination { display:flex; align-items:center; justify-content:center; gap:8px; padding:32px 0 8px; }
    .page-btn { padding:7px 16px; font-size:13px; font-weight:600; border:1px solid var(--gray-200); border-radius:var(--r-sm); background:var(--white); color:var(--gray-700); cursor:pointer; transition:all .15s; font-family:inherit; }
    .page-btn:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
    .page-btn:disabled { opacity:.4; cursor:not-allowed; }
    .page-info { font-size:13px; color:var(--gray-500); padding:0 10px; }

    @media(max-width:640px) {
      .main{padding:16px} .detail-panel{width:100%}
      .match-grid{grid-template-columns:1fr}
      .h2h-picker{flex-direction:column}
      .h2h-summary-card{grid-template-columns:1fr}
      .h2h-list-head{display:none}
    }
  

    
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="#" class="logo"><div class="logo-icon">&#x26BD;</div>Match Center</a>
    <span class="nav-live">Live Data</span>
  </div>
</nav>
<main class="main">
  <div class="page-header">
    <h1 class="page-title">Matches</h1>
    <p class="page-sub" id="subtitle">Loading...</p>
  </div>
  <div class="league-tabs" id="league-tabs"></div>
  <div class="toolbar" id="toolbar">
    <div class="view-toggle">
      <button class="vbtn active" id="btn-matches" onclick="switchView('matches')">Matches</button>
      <button class="vbtn" id="btn-teams" onclick="switchView('teams')">Teams</button>
      <button class="vbtn" id="btn-h2h" onclick="switchView('h2h')">H2H</button>
      <button class="vbtn" id="btn-team" onclick="switchView('team')" style="display:none;">Team</button>
      <button class="vbtn" id="btn-dash" onclick="switchView('dash')">Dashboard</button>
    </div>
    <div class="tsep" id="mf-sep"></div>
    <div id="match-filters" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <select class="fsel" id="season-sel" onchange="onSeasonChange(this.value)"></select>
      <select class="fsel" id="round-sel" onchange="onRoundChange(this.value)"><option value="">All Rounds</option></select>
      <div class="pills">
        <button class="pill active" data-s="" onclick="onStatus('',this)">All</button>
        <button class="pill" data-s="upcoming" onclick="onStatus('upcoming',this)">Upcoming</button>
        <button class="pill" data-s="ongoing" onclick="onStatus('ongoing',this)">Live</button>
        <button class="pill" data-s="finished" onclick="onStatus('finished',this)">Finished</button>
      </div>
    </div>
    <select class="fsel" id="teams-season-sel" style="display:none;" onchange="onTeamsSeason(this.value)"></select>
  </div>

  <!-- Matches -->
  <div id="view-matches">
    <div class="match-grid" id="match-grid"><div class="state-box"><div class="spinner"></div></div></div>
    <div class="pagination" id="pagination" style="display:none;">
      <button class="page-btn" id="prev-btn" onclick="changePage(-1)">&larr; Prev</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="next-btn" onclick="changePage(1)">Next &rarr;</button>
    </div>
  </div>

  <!-- Teams -->
  <div id="view-teams" style="display:none;">
    <div class="team-grid" id="team-grid"><div class="state-box" style="grid-column:1/-1"><div class="spinner"></div></div></div>
  </div>

  <!-- Team Matches (inline view) -->
  <div id="view-team" style="display:none;">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:20px; padding:16px 0; border-bottom:1px solid var(--gray-200);">
      <img id="tv-logo" src="" style="width:44px; height:44px; object-fit:contain;" onerror="this.style.opacity=0.2">
      <div>
        <div id="tv-name" style="font-size:20px; font-weight:900; color:var(--gray-900);"></div>
        <div id="tv-meta" style="font-size:12px; color:var(--gray-500); margin-top:2px;"></div>
      </div>
      <button onclick="closeTeamView()" style="margin-left:auto; background:none; border:1.5px solid var(--gray-200); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; color:var(--gray-600); font-family:inherit;">← Back to Teams</button>
    </div>

    <!-- Toolbar -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <select id="tv-season-sel" class="fsel" onchange="TV.season=this.value;TV.result='';TV.page=1;setTVResultPills('');fetchTeamView()">
        <option value="">All Seasons</option>
      </select>
      <div class="pills" id="tv-result-pills">
        <button class="pill active" onclick="setTVResultPills('');TV.result='';TV.page=1;fetchTeamView()">All</button>
        <button class="pill" onclick="setTVResultPills('W');TV.result='W';TV.page=1;fetchTeamView()" style="color:var(--green)">Win</button>
        <button class="pill" onclick="setTVResultPills('D');TV.result='D';TV.page=1;fetchTeamView()" style="color:var(--gray-500)">Draw</button>
        <button class="pill" onclick="setTVResultPills('L');TV.result='L';TV.page=1;fetchTeamView()" style="color:var(--red)">Loss</button>
      </div>
      <span style="flex:1"></span>
      <span class="pill" id="tv-stat-w" style="background:#d1fae5;color:#059669;cursor:default;">W -</span>
      <span class="pill" id="tv-stat-d" style="background:#f1f5f9;color:#64748b;cursor:default;">D -</span>
      <span class="pill" id="tv-stat-l" style="background:#fee2e2;color:#dc2626;cursor:default;">L -</span>
    </div>

    <!-- H2H-style table header -->
      <div style="display:grid; grid-template-columns:100px 70px 90px 1fr; gap:12px; padding:8px 20px; background:var(--gray-100); border-radius:8px 8px 0 0; font-size:11px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.05em; align-items:center;">
        <span>Date</span><span>Season</span><span>Round</span><span style="text-align:center;">Match</span>
      </div>
    <div id="tv-rows" style="border:1px solid var(--gray-200); border-top:none; border-radius:0 0 8px 8px; overflow:hidden;">
      <div class="state-box"><div class="spinner"></div></div>
    </div>

    <!-- Pagination -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
      <button class="page-btn" id="tv-prev" onclick="TV.page--;fetchTeamView()" disabled>← Prev</button>
      <span id="tv-page-info" style="font-size:13px; font-weight:600; color:var(--gray-500);">-</span>
      <button class="page-btn" id="tv-next" onclick="TV.page++;fetchTeamView()" disabled>Next →</button>
    </div>
  </div>

  <!-- H2H -->
  <div id="view-h2h" style="display:none;">
    <div class="h2h-wrap">
      <div class="h2h-picker">
        <div class="h2h-side">
          <div class="h2h-side-label">Team 1</div>
          <select class="h2h-sel" id="h2h-t1" onchange="onH2HChange()"><option value="">Select team...</option></select>
        </div>
        <div class="h2h-mid"><div class="h2h-vs">VS</div></div>
        <div class="h2h-side">
          <div class="h2h-side-label">Team 2</div>
          <select class="h2h-sel" id="h2h-t2" onchange="onH2HChange()"><option value="">Select team...</option></select>
        </div>
        <div class="h2h-side" style="max-width:180px;">
          <div class="h2h-side-label">Filter by League</div>
          <select class="h2h-sel" id="h2h-league-filter" onchange="onH2HChange()"><option value="">All Leagues</option></select>
        </div>
        <button class="h2h-btn" id="h2h-go" onclick="doH2H()" disabled>&#x26A1; Compare</button>
      </div>
      <div class="h2h-results" id="h2h-res">
        <div class="h2h-summary-card">
          <div class="h2h-team-col">
            <img id="h2h-l1" src="" onerror="this.style.display='none'" />
            <div class="n" id="h2h-n1"></div>
          </div>
          <div class="h2h-center">
            <div class="h2h-score-row">
              <div class="h2h-stat t1"><div class="num" id="h2h-w1">0</div><div class="lbl">Wins</div></div>
              <div class="h2h-divider"></div>
              <div class="h2h-stat dr"><div class="num" id="h2h-d">0</div><div class="lbl">Draws</div></div>
              <div class="h2h-divider"></div>
              <div class="h2h-stat t2"><div class="num" id="h2h-w2">0</div><div class="lbl">Wins</div></div>
            </div>
            <div class="h2h-count" id="h2h-cnt"></div>
          </div>
          <div class="h2h-team-col">
            <img id="h2h-l2" src="" onerror="this.style.display='none'" />
            <div class="n" id="h2h-n2"></div>

        <div class="h2h-list">
          <div class="h2h-list-head">
          <span>Date</span><span>Team 1</span><span>Score</span><span>Team 2</span><span>League</span><span>Season</span><span>Round</span>

<div class="detail-panel" id="detail-panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">&#x2715;</button>
    <div class="panel-lg" id="panel-league"></div>
    <div class="panel-score-row">
      <div class="p-team">
        <img id="p-hl" src="" onerror="this.style.display='none'" />
        <div class="p-name" id="p-h"></div>
      </div>
      <div class="p-score" id="p-score"></div>
      <div class="p-team">
        <img id="p-al" src="" onerror="this.style.display='none'" />
        <div class="p-name" id="p-a"></div>
      </div>
    </div>
    <div class="panel-meta"><span id="p-ko"></span><span id="p-badge"></span></div>
  </div>
  <div class="panel-tabs">
    <button class="panel-tab active" onclick="switchTab('events',this)">Events</button>
    <button class="panel-tab" onclick="switchTab('lineup',this)">Lineup</button>
    <button class="panel-tab" onclick="switchTab('stats',this)">Stats</button>
  </div>

    <div id="tab-events" class="tab-s active"><div class="state-box"><div class="spinner"></div></div></div>
    <div id="tab-lineup" class="tab-s"><div class="state-box"><div class="spinner"></div></div></div>
    <div id="tab-stats" class="tab-s"><div class="state-box"><div class="spinner"></div></div></div>
  </div>
</div>


  <div id="view-dash" style="display:none; padding: 20px 0;">
    <div id="dash-filters" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap; margin-bottom: 20px;">
      <select class="fsel" id="dash-league-sel" onchange="onDashLeagueChange(this.value)">
         <option value="">All Leagues</option>
      </select>
      <select class="fsel" id="dash-from-sel" onchange="loadDashboard()">
         <option value="">From Season (All)</option>
      </select>
      <select class="fsel" id="dash-to-sel" onchange="loadDashboard()">
         <option value="">To Season (All)</option>
      </select>
    </div>
    <div id="dash-content"></div>
  </div>
<script>
const API_BASE = '';
let ST = { view:'matches', leagueId:null, leagueSlug:null, status:'', round:'', season:'', page:1, pageSize:18, total:0, selectedId:null };
let LEAGUES = [];
let H2H_TEAMS = [];

const $get = async u => { const r=await fetch(u); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const fmt = iso => { if(!iso) return '--'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const fmtS = iso => { if(!iso) return '--'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const lname = slug => { const l=LEAGUES.find(x=>x.slug===slug); return l?l.name:slug; };
const evIcon = (t,c) => t==='Goal'?'&#x26BD;':t==='Card'?c==='Red'?'&#x1F7E5;':'&#x1F7E8;':t==='Substitution'?'&#x1F504;':t==='MissedPenalty'?'&#x274C;':'&bull;';
function bdg(s) {
  const m={finished:['FT','badge-finished'],ft:['FT','badge-finished'],ongoing:['LIVE','badge-ongoing'],upcoming:['Soon','badge-upcoming']};
  const [l,c]=m[(s||'').toLowerCase()]||[s,'badge-upcoming'];
  return `<span class="badge ${c}">${l}</span>`;
}

function switchView(v) {
    // Hide team-specific button unless in team view
    document.getElementById('btn-team').style.display = v === 'team' ? 'inline-flex' : 'none';
  ST.view=v;
  ['matches','teams','h2h','dash','team'].forEach(x=>{
    document.getElementById(`view-${x}`).style.display=x===v?'block':'none';
    document.getElementById(`btn-${x}`).classList.toggle('active',x===v);
  });
  const mf=document.getElementById('match-filters'),sep=document.getElementById('mf-sep'),ts=document.getElementById('teams-season-sel');
  if(v==='matches'){mf.style.display='flex';sep.style.display='';ts.style.display='none';loadMatches();}
  else if(v==='teams'){mf.style.display='none';sep.style.display='none';ts.style.display='';syncTeamsSeason();loadTeams();}
  else if(v==='h2h'){mf.style.display='none';sep.style.display='none';ts.style.display='none';loadH2HTeams();}
  else {mf.style.display='none';sep.style.display='none';ts.style.display='none'; populateDashLeagues(); loadDashboard();}
}

async function loadLeagues() {
  try {
    LEAGUES = await $get('/api/v1/leagues/');
    const tabs=document.getElementById('league-tabs');
    tabs.innerHTML='';
    LEAGUES.forEach((l,i)=>{
      const b=document.createElement('button');
      b.className=`tab-btn${i===0?' active':''}`;
      b.innerHTML=`<img src="/static/logos/${l.slug}.png" onerror="this.style.display='none'" />${l.name}`;
      b.onclick=()=>selLeague(l.fotmob_id,l.slug,b);
      tabs.appendChild(b);
    });
    if(LEAGUES.length){ST.leagueId=LEAGUES[0].fotmob_id;ST.leagueSlug=LEAGUES[0].slug;}
  } catch(e){console.error(e);}
}

function selLeague(id,slug,btn) {
  ST.leagueId=id;ST.leagueSlug=slug;ST.page=1;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadSeasons(id).then(()=>{
    if(ST.view==='teams') loadTeams();
    else if(ST.view==='h2h') loadH2HTeams();
    else loadMatches();
  });
}

async function loadSeasons(lid) {
  try {
    let url='/api/v1/leagues/seasons'; if(lid) url+=`?league_id=${lid}`;
    const s=await $get(url);
    ['season-sel','teams-season-sel'].forEach(id=>{
      const el=document.getElementById(id); if(!el) return;
      el.innerHTML='';
      (s||[]).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o);});
    });
    ST.season=(s||[])[0]||''; await loadRounds();
  } catch(e){console.error(e);}
}



function syncTeamsSeason(){const s=document.getElementById('season-sel'),t=document.getElementById('teams-season-sel');t.innerHTML=s.innerHTML;t.value=ST.season;}
function onSeasonChange(v){ST.season=v;ST.page=1;ST.round='';loadRounds();loadMatches();}
function onRoundChange(v){ST.round=v;ST.page=1;loadMatches();}
function onStatus(s,btn){ST.status=s;ST.page=1;document.querySelectorAll('[data-s]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadMatches();}
function onTeamsSeason(v){ST.season=v;loadTeams();}
function changePage(d){ST.page=Math.max(1,ST.page+d);loadMatches();}

async function loadRounds() {
  const sel = document.getElementById('round-sel');
  const currentVal = ST.round;
  let url = `/api/v1/leagues/rounds?`;
  if(ST.leagueId) url += `league_id=${ST.leagueId}&`;
  if(ST.season) url += `season=${encodeURIComponent(ST.season)}`;
  
  try {
    const rounds = await $get(url);
    sel.innerHTML = '<option value="">All Rounds</option>';
    rounds.forEach(r => {
      const o = document.createElement('option');
      o.value = r;
      // if it is a number, prefix with "Round "
      if (!isNaN(r)) {
         o.textContent = `Round ${r}`;
      } else {
         o.textContent = r;
      }
      if (r === currentVal) o.selected = true;
      sel.appendChild(o);
    });
  } catch(e) { console.error("Failed to load rounds", e); }
}

async function loadMatches() {
  document.getElementById('match-grid').innerHTML='<div class="state-box"><div class="spinner"></div></div>';
  document.getElementById('pagination').style.display='none';
  let url=`/api/v1/matches/?page=${ST.page}&page_size=${ST.pageSize}`;
  if(ST.leagueId) url+=`&league_id=${ST.leagueId}`;
  if(ST.status) url+=`&status=${ST.status}`;
  if(ST.round) url+=`&matchweek=${ST.round}`;
  if(ST.season) url+=`&season=${encodeURIComponent(ST.season)}`;
  try{
    const data=await $get(url);
    ST.total=data.total;
    renderMatches(data.matches);
    renderPagination(data.total);
    document.getElementById('subtitle').textContent=`${data.total} match${data.total!==1?'es':''} found`;
  } catch(e){
    document.getElementById('match-grid').innerHTML=`<div class="state-box"><span class="state-icon">&#x26A0;&#xFE0F;</span><span class="state-title">Failed to load</span><span class="state-desc">${e.message}</span></div>`;
  }
}

function renderMatches(matches) {
  const g=document.getElementById('match-grid');
  if(!matches.length){g.innerHTML='<div class="state-box"><span class="state-icon">&#x1F4ED;</span><span class="state-title">No matches found</span><span class="state-desc">Try adjusting your filters.</span></div>';return;}
  g.innerHTML=matches.map(m=>{
    const hs=m.home_score!=null&&m.away_score!=null;
    const sc=hs?`<span class="score">${m.home_score}<span class="score-sep">-</span>${m.away_score}</span>`:`<span class="score-vs">vs</span>`;
    const sel=ST.selectedId===m.match_id?' selected':'';
    
    return `
      <div class="match-card${sel}" onclick="openMatch('${m.match_id}', this)" id="card-${m.match_id}">
        <div class="card-meta">
          <span class="card-league"><img src="/static/logos/${m.league_slug}.png" onerror="this.style.display='none'" />${lname(m.league_slug)}</span>
          <span class="card-round">${(!isNaN(m.round) && m.round) ? 'Round ' + m.round : ((m.round || '').replace(/^Rd /, 'Round ') || '--')}</span>
        </div>
        <div class="card-teams">
          <div class="team-home">
            <div class="team-name">${m.home_team_name}</div>
            <img class="team-logo" src="/static/logos/${m.home_team_id}.png" onerror="this.style.display='none'" />
          </div>
          <div class="score-box">${sc}</div>
          <div class="team-away">
            <img class="team-logo" src="/static/logos/${m.away_team_id}.png" onerror="this.style.display='none'" />
            <div class="team-name">${m.away_team_name}</div>
          </div>
        </div>
        <div class="card-footer">
          <span class="ktime">${fmt(m.kickoff_utc)}</span>
          ${bdg(m.status)}
        </div>
      </div>
    `;
  }).join('');
}

function renderPagination(total) {
  const pages=Math.ceil(total/ST.pageSize);
  if(pages<=1){document.getElementById('pagination').style.display='none';return;}
  document.getElementById('pagination').style.display='flex';
  document.getElementById('prev-btn').disabled=ST.page<=1;
  document.getElementById('next-btn').disabled=ST.page>=pages;
  document.getElementById('page-info').textContent=`Page ${ST.page} of ${pages}`;
}

async function loadTeams() {
  const g=document.getElementById('team-grid');
  g.innerHTML='<div class="state-box" style="grid-column:1/-1"><div class="spinner"></div></div>';
  try{
    let url=`/api/v1/leagues/teams?`; if(ST.leagueId) url+=`league_id=${ST.leagueId}&`; if(ST.season) url+=`season=${ST.season}`;
    const teams=await $get(url);
    if(!teams||!teams.length){g.innerHTML='<div class="state-box" style="grid-column:1/-1"><span class="state-icon">&#x1F465;</span><span class="state-title">No teams found</span></div>';return;}
    g.innerHTML=teams.map(t=>`
      <div class="team-card" onclick="openTeamMatches('${t.team_id}', '${t.team_name.replace('\'', '\\\'')}')" style="cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='var(--sh)';" onmouseout="this.style.transform='none'; this.style.boxShadow='none';">
        <img src="/static/logos/${t.team_id}.png" onerror="this.style.opacity=0.2" />
        <div class="tname">${t.team_name}</div>
      </div>
    `).join('');
  } catch(e){g.innerHTML=`<div class="state-box" style="grid-column:1/-1"><span class="state-title" style="color:var(--red)">${e.message}</span></div>`;}
}

async function loadH2HTeams() {
  try{
    const url = '/api/v1/leagues/teams';
    H2H_TEAMS=await $get(url);
    
    // Group teams by domestic_league
    const grouped = H2H_TEAMS.reduce((acc, t) => {
        const l = t.domestic_league || 'other';
        if(!acc[l]) acc[l] = [];
        acc[l].push(t);
        return acc;
    }, {});
    
    // Sort leagues (other at bottom)
    const leagues = Object.keys(grouped).sort((a,b) => {
        if(a === 'other') return 1;
        if(b === 'other') return -1;
        return a.localeCompare(b);
    });
    
    const sel1 = document.getElementById('h2h-t1');
    const sel2 = document.getElementById('h2h-t2');
    sel1.innerHTML='<option value="">Select team...</option>';
    sel2.innerHTML='<option value="">Select team or league...</option>';
    
    // For Team 2, add a "Leagues" optgroup at the top
    const lgGroup = document.createElement('optgroup');
    lgGroup.label = "--- LEAGUES ---";
    LEAGUES.forEach(lg => {
        const o = document.createElement('option');
        o.value = 'league_' + lg.slug;
        o.textContent = `All teams in ${lg.name}`;
        lgGroup.appendChild(o);
    });
    sel2.appendChild(lgGroup);
    
    leagues.forEach(l => {
        const label = l === 'other' ? 'Other Teams' : lname(l);
        const g1 = document.createElement('optgroup'); g1.label = label;
        const g2 = document.createElement('optgroup'); g2.label = label;
        grouped[l].forEach(t => {
            const o1 = document.createElement('option'); o1.value = t.team_id; o1.textContent = t.team_name;
            const o2 = document.createElement('option'); o2.value = t.team_id; o2.textContent = t.team_name;
            g1.appendChild(o1);
            g2.appendChild(o2);
        });
        sel1.appendChild(g1);
        sel2.appendChild(g2);
    });
    
    document.getElementById('h2h-res').classList.remove('on');
  } catch(e){console.error(e);}
}

function onH2HChange() {
  const t1=document.getElementById('h2h-t1').value, t2=document.getElementById('h2h-t2').value;
  document.getElementById('h2h-go').disabled=!(t1&&t2&&t1!==t2);
}

async function doH2H() {
  const t1id=document.getElementById('h2h-t1').value, t2val=document.getElementById('h2h-t2').value;
  let isLeague = t2val.startsWith('league_');
  let t2id = isLeague ? null : t2val;
  let vs_league = isLeague ? t2val.replace('league_', '') : null;
  
  const t1=H2H_TEAMS.find(t=>t.team_id===t1id);
  document.getElementById('h2h-l1').src=`/static/logos/${t1id}.png`;
  document.getElementById('h2h-n1').textContent=t1?.team_name||'';
  
  if (isLeague) {
      document.getElementById('h2h-l2').src=`/static/logos/${vs_league}.png`;
      document.getElementById('h2h-n2').textContent=`vs ${lname(vs_league)}`;
  } else {
      const t2=H2H_TEAMS.find(t=>t.team_id===t2id);
      document.getElementById('h2h-l2').src=`/static/logos/${t2id}.png`;
      document.getElementById('h2h-n2').textContent=t2?.team_name||'';
  }
  
  document.getElementById('h2h-rows').innerHTML='<div class="state-box"><div class="spinner"></div></div>';
  document.getElementById('h2h-res').classList.add('on');
  try{
    const leagueFilter = document.getElementById('h2h-league-filter').value;
    let url = `/api/v1/matches/h2h?team1_id=${t1id}&limit=200`;
    if(t2id) url += `&team2_id=${t2id}`;
    if(vs_league) url += `&vs_league_slug=${vs_league}`;
    const ms=await $get(url);
    // Populate league filter options from results
    const leagueSlugs = [...new Set(ms.map(m => m.league_slug).filter(Boolean))];
    const lf = document.getElementById('h2h-league-filter');
    const currentVal = lf.value;
    lf.innerHTML = '<option value="">All Leagues</option>' + leagueSlugs.map(s => `<option value="${s}" ${s===currentVal?'selected':''}>${lname(s)}</option>`).join('');
    const filtered = leagueFilter ? ms.filter(m => m.league_slug === leagueFilter) : ms;
    const fin=filtered.filter(m=>['ft','finished'].includes((m.status||'').toLowerCase()));
    let w1=0,w2=0,d=0;
    fin.forEach(m=>{
      const hs=m.home_score??0,as=m.away_score??0;
      if(hs===as){d++;}else{const t1h=m.home_team_id===t1id;if((t1h&&hs>as)||(!t1h&&as>hs))w1++;else w2++;}
    });
    document.getElementById('h2h-w1').textContent=w1;
    document.getElementById('h2h-d').textContent=d;
    document.getElementById('h2h-w2').textContent=w2;
    document.getElementById('h2h-cnt').textContent=`${fin.length} matches played`;
    if(!filtered.length){document.getElementById('h2h-rows').innerHTML='<div class="state-box"><span class="state-icon">&#x1F4ED;</span><span class="state-title">No H2H matches found</span></div>';return;}
    document.getElementById('h2h-rows').innerHTML=filtered.map(m=>{
      const hs=m.home_score??0, as=m.away_score??0, scored=m.home_score!=null&&m.away_score!=null;
      const hw=scored&&hs>as, aw=scored&&as>hs;
      
      const isHome = m.home_team_id == t1id;
      const t1_name = isHome ? m.home_team_name : m.away_team_name;
      const t1_id = isHome ? m.home_team_id : m.away_team_id;
      const t2_name = isHome ? m.away_team_name : m.home_team_name;
      const t2_id = isHome ? m.away_team_id : m.home_team_id;
      
      const sc1 = isHome ? hs : as;
      const sc2 = isHome ? as : hs;
      const w1 = isHome ? hw : aw;
      const w2 = isHome ? aw : hw;

async function openMatch(id, card) {
  if(ST.selectedId===id){closePanel();return;}
  ST.selectedId=id;
  document.querySelectorAll('.match-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  ['events','lineup','stats'].forEach(t=>document.getElementById(`tab-${t}`).innerHTML='<div class="state-box"><div class="spinner"></div></div>');
  document.querySelectorAll('.panel-tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  document.querySelectorAll('.tab-s').forEach((s,i)=>s.classList.toggle('active',i===0));
  document.getElementById('overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  try{
    const det=await $get(`/api/v1/matches/${id}`);
    const m=det.match;
    document.getElementById('panel-league').innerHTML=`<img src="/static/logos/${m.league_slug}.png" onerror="this.style.display='none'" />${lname(m.league_slug)} &middot; ${(!isNaN(m.round) && m.round) ? 'Round ' + m.round : ((m.round || '').replace(/^Rd /, 'Round ') || '--')}`;

    document.getElementById('p-a').textContent=m.away_team_name;

    al.src=`/static/logos/${m.away_team_id}.png`;al.style.display='block';
    const hs=m.home_score!=null&&m.away_score!=null;
    document.getElementById('p-score').textContent=hs?`${m.home_score} - ${m.away_score}`:'vs';
    document.getElementById('p-ko').textContent=fmt(m.kickoff_utc);
    document.getElementById('p-badge').innerHTML=bdg(m.status);
    renderEvs(det.events,m); renderLu(det.lineup); renderSt(det.stats);
  } catch(e){document.getElementById('tab-events').innerHTML=`<div class="state-box"><span>Failed: ${e.message}</span></div>`;}

function renderEvs(events,match) {
  const el=document.getElementById('tab-events');
  if(!events.length){el.innerHTML='<div class="state-box"><span class="state-icon">&#x1F4CB;</span><span class="state-title">No events yet</span></div>';return;}
  const first=events.filter(e=>(e.minute||0)<=45), second=events.filter(e=>(e.minute||0)>45);
  const row=e=>{
    const away=e.is_home===false;
    const scoreBadge = (e.new_score_home!=null && e.new_score_away!=null && e.event_type==='Goal') 
      ? `<span class="ev-score">${e.new_score_home}-${e.new_score_away}</span>` 
      : '';
    const assist = e.assist_player_name ? `<div class="ev-assist">Assist: ${e.assist_player_name}</div>` : '';
    const off = e.player_out_name ? `<div class="ev-assist">Off: ${e.player_out_name}</div>` : '';
    return `
      <div class="ev-item${away?' away':''}">
        <span class="ev-icon">${evIcon(e.event_type,e.card_type)}</span>
        <span class="ev-min">${e.minute||'?'}'</span>
        <div class="ev-info">
          <div class="ev-player">${e.player_name||e.player_in_name||'--'}</div>
          ${assist}${off}
        </div>
        ${scoreBadge}
      </div>
    `;
  };
  el.innerHTML=`
    <div>
      ${first.length?`<div class="sdiv">First Half</div>${first.map(row).join('')}`:''}
      ${second.length?`<div class="sdiv">Second Half</div>${second.map(row).join('')}`:''}
    </div>
  `;
}

function renderSt(stats) {
  const el=document.getElementById('tab-stats');
  if(!stats||!stats.length){el.innerHTML='<div class="state-box"><span class="state-icon">&#x1F4CA;</span><span class="state-title">Stats not available</span></div>';return;}
  const periods={};
  stats.forEach(s=>{if(!periods[s.period])periods[s.period]={};if(!periods[s.period][s.group])periods[s.period][s.group]=[];periods[s.period][s.group].push(s);});
  const pk=periods['All']?'All':Object.keys(periods)[0];
  const groups=periods[pk]||{};
  el.innerHTML=Object.entries(groups).map(([g,rows])=>`
    <div class="sg-lbl">${g}</div>
    ${rows.map(r=>`
      <div class="st-row">
        <div class="st-h">${r.home_value??'--'}</div>
        <div class="st-l">${r.stat_title}</div>
        <div class="st-a">${r.away_value??'--'}</div>
      </div>
    `).join('')}
  `).join('')||'<div class="state-box"><span>No data</span></div>';
}

async function fetchTeamView() {
  const rows = document.getElementById('tv-rows');
  rows.innerHTML = '<div class="state-box"><div class="spinner"></div></div>';

  try {
    // Fetch all matches at once (client-side filter/sort)
    let url = `/api/v1/matches/?team_id=${TV.teamId}&page=1&page_size=2000`;
    if (TV.season) url += `&season=${encodeURIComponent(TV.season)}`;

    const res = await fetch(url);
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    let allMatches = data.matches || [];

    // Sort: finished desc by date, upcoming asc by date
    allMatches.sort((a, b) => {
      const aP = a.home_score !== null && a.away_score !== null;
      const bP = b.home_score !== null && b.away_score !== null;
      if (aP && !bP) return -1;
      if (!aP && bP) return 1;
      if (aP)  return new Date(b.kickoff_utc) - new Date(a.kickoff_utc);
      return new Date(a.kickoff_utc) - new Date(b.kickoff_utc);
    });

    // Full-season W/D/L (before result filter)
    let W=0, D=0, L=0;
    allMatches.forEach(m => {
      if (m.home_score === null || m.away_score === null) return;
      const isHome = String(m.home_team_id) === String(TV.teamId);
      const mine = isHome ? m.home_score : m.away_score;
      const opp  = isHome ? m.away_score : m.home_score;
      if (mine > opp) W++; else if (mine === opp) D++; else L++;
    });
    document.getElementById('tv-stat-w').textContent = `W ${W}`;
    document.getElementById('tv-stat-d').textContent = `D ${D}`;
    document.getElementById('tv-stat-l').textContent = `L ${L}`;

    // Apply result filter
    let matches = allMatches;
    if (TV.result) {
      matches = allMatches.filter(m => {
        if (m.home_score === null || m.away_score === null) return false;
        const isHome = String(m.home_team_id) === String(TV.teamId);
        const mine = isHome ? m.home_score : m.away_score;
        const opp  = isHome ? m.away_score : m.home_score;
        const r = mine > opp ? 'W' : mine === opp ? 'D' : 'L';
        return r === TV.result;
      });
    }

    const seasonLabel = TV.season || 'All Seasons';
    document.getElementById('tv-meta').textContent = `${matches.length} matches · ${seasonLabel}`;

    if (!matches.length) {
      rows.innerHTML = '<div class="state-box"><span class="state-icon">📋</span><span class="state-title">No matches found</span></div>';
    } else {
      rows.innerHTML = matches.map((m, idx) => {
        const isHome = String(m.home_team_id) === String(TV.teamId);
        const played = m.home_score !== null && m.away_score !== null;
        const homeWin = played && m.home_score > m.away_score;
        const awayWin = played && m.away_score > m.home_score;

        // Score display & color based on MY team result
        let scoreColor = '#64748b', scoreBg = 'transparent', scoreStr = 'vs', scoreFw = 500, scoreFz = '12px';
        if (played) {
          scoreStr = `${m.home_score} – ${m.away_score}`;
          scoreFw = 900; scoreFz = '15px';
          const mine = isHome ? m.home_score : m.away_score;
          const opp  = isHome ? m.away_score : m.home_score;
          if (mine > opp)      { scoreColor='#059669'; scoreBg='#d1fae5'; }
          else if (mine < opp) { scoreColor='#dc2626'; scoreBg='#fee2e2'; }
          else                 { scoreColor='#64748b'; scoreBg='#f1f5f9'; }
        }

        // Name colors: winner bold+green, loser faded gray
        const homeColor  = homeWin ? '#059669' : awayWin ? '#94a3b8' : 'var(--gray-800)';
        const awayColor  = awayWin ? '#059669' : homeWin ? '#94a3b8' : 'var(--gray-800)';
        const homeWeight = homeWin ? 800 : awayWin ? 400 : 600;
        const awayWeight = awayWin ? 800 : homeWin ? 400 : 600;

        const d = m.kickoff_utc ? new Date(m.kickoff_utc) : null;
        const dateStr = d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : '—';
        const rowBg = idx % 2 === 0 ? 'var(--white)' : 'var(--gray-50)';
          const roundStr = (!isNaN(m.round) && m.round) ? 'Round ' + m.round : ((m.round || '').replace(/^Rd /, 'Round ') || '--');

        return `<div onclick="openMatch('${m.match_id}',null)" style="display:grid; grid-template-columns:100px 70px 90px 1fr; gap:12px; padding:12px 20px; background:${rowBg}; cursor:pointer; transition:background .15s; align-items:center; border-top:${idx>0?'1px solid var(--gray-100)':0};" onmouseover="this.style.background='var(--blue-light)'" onmouseout="this.style.background='${rowBg}'">
              <span class="h2h-date">${dateStr}</span>
              <span class="h2h-s">${m.season||''}</span>
              <div><span class="card-round" title="${roundStr}">${roundStr}</span></div>
              <div style="display:flex; align-items:center; justify-content:center; gap:0;">
              <div style="display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-end;">
                <span style="font-size:13px; font-weight:${homeWeight}; color:${homeColor}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">${m.home_team_name}</span>
                <img src="/static/logos/${m.home_team_id}.png" onerror="this.style.opacity=0.1" style="width:22px; height:22px; object-fit:contain; flex-shrink:0;">
              </div>
              <div style="min-width:76px; text-align:center; padding:4px 8px; margin:0 10px; border-radius:6px; background:${scoreBg};">
                <span style="font-size:${scoreFz}; font-weight:${scoreFw}; color:${scoreColor}; letter-spacing:-.3px;">${scoreStr}</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-start;">
                <img src="/static/logos/${m.away_team_id}.png" onerror="this.style.opacity=0.1" style="width:22px; height:22px; object-fit:contain; flex-shrink:0;">
                <span style="font-size:13px; font-weight:${awayWeight}; color:${awayColor}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">${m.away_team_name}</span>
              </div>
            </div>
            </div>`;
      }).join('');
    }

    // Hide server-side pagination (all loaded client-side)
    document.getElementById('tv-prev').style.display = 'none';
    document.getElementById('tv-next').style.display = 'none';
    document.getElementById('tv-page-info').textContent = '';

  } catch(e) {
    document.getElementById('tv-rows').innerHTML = `<div class="state-box"><span class="state-icon">⚠️</span><span class="state-title">Error: ${e.message}</span></div>`;
  }
}

</script>
