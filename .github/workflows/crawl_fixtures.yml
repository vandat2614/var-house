name: Crawl Fixtures

on:
  schedule:
    - cron: '0 0 * * 1' # Midnight UTC
  workflow_dispatch:

jobs:
  crawl-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Fixtures Crawler
        env:
          R2_ENDPOINT: ${{ secrets.ENDPOINT }}
          R2_BUCKET_NAME: "var-house-prod"
          R2_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          NEON_POSTGRES_URI: ${{ secrets.NEON_POSTGRES_CONN_STR }}
        run: |
          export PYTHONPATH="."
          python -m src.jobs.crawl_fixtures

